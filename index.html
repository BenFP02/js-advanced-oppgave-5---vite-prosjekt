<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Tracker</title>
    <script type="module" crossorigin src="/js-advanced-oppgave-5---vite-prosjekt/assets/index-DeW2G_9O.js"></script>
    <link rel="stylesheet" crossorigin href="/js-advanced-oppgave-5---vite-prosjekt/assets/index-B2KX67Lf.css">
  </head>
  <body>
    <div class="app-container">
      <h1>Task Tracker</h1>

      <form id="task-form">
        <input type="text" id="task-title" placeholder="Task title" required />
        <input type="date" id="task-date" />
        <button type="submit">Add Task</button>
      </form>
      <label>
        <input type="checkbox" id="show-completed" />
        Show completed tasks
      </label>

      <p id="task-summary"></p>
      <ul id="task-list"></ul>

    </div>
  </body>
</html>
